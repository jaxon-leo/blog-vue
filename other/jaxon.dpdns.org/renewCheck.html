<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域名续订确认</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:disabled {
            background-color: #ddd;
            cursor: not-allowed;
        }

        .recent-time {
            font-size: 14px;
            color: #555;
            margin-top: 20px;
        }

        .success-icon {
            font-size: 24px;
            color: #22c55e;
            margin-left: 10px;
            display: none;
        }

        .loading {
            font-size: 16px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>我已续订</h1>
    <div class="button-container">
        <button id="confirmBtn" class="btn" onclick="confirmRenew()">确认</button>
        <span id="successIcon" class="success-icon">✓</span>
    </div>
    <div id="recentTime" class="recent-time"></div>
</div>

<script>
    // 获取最近续订时间的接口
    function fetchLastRenewTime() {
        fetch('https://dejavu.zone/email/check/getDomainCheckTime')
            .then(response => response.text())
            .then(time => {
                if (time) {
                    document.getElementById('recentTime').innerText = `最近续订时间：${time}`;
                }
            })
            .catch(error => {
                console.log('获取续订时间失败，忽略错误');
            });
    }

    // 处理点击确认按钮
    function confirmRenew() {
        const confirmBtn = document.getElementById('confirmBtn');
        const successIcon = document.getElementById('successIcon');

        // 禁用按钮
        confirmBtn.disabled = true;

        // 调用确认续订接口
        fetch('https://dejavu.zone/email/check/domain', {
            method: 'GET'
        })
            .then(response => {
                if (response.ok) {
                    successIcon.style.display = 'inline';

                    // 再次获取续订时间
                    fetchLastRenewTime();
                    
                    // // 3秒后隐藏成功图标
                    // setTimeout(() => {
                    //     successIcon.style.display = 'none';
                    //
                    //     // 恢复按钮状态
                    //     confirmBtn.disabled = false;
                    // }, 3000);
                }
            })
            .catch(error => {
                console.log('续订确认失败，忽略错误');
                
                // 恢复按钮状态
                confirmBtn.disabled = false;
            });
    }

    // 页面加载时自动获取续订时间
    window.onload = function() {
        fetchLastRenewTime();
    }
</script>

</body>
</html>
