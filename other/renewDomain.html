<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
    <tr>
        <td align="center">

            <table width="520" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.06);padding:40px;">

                <tr>
                    <td align="center" style="font-size:22px;font-weight:bold;color:#1f2937;">
                        域名续订提醒
                    </td>
                </tr>

                <tr><td height="20"></td></tr>

                <tr>
                    <td align="center" style="font-size:15px;color:#4b5563;line-height:1.6;">
                        您的免费域名剩余使用时间已不足
                        <span style="color:#ef4444;font-weight:bold;">7 天</span><br>
                        为避免域名服务中断，请尽快完成续订。
                    </td>
                </tr>

                <tr><td height="30"></td></tr>

                <tr>
                    <td align="center">
                        <a href="https://dash.domain.digitalplat.org/"
                           style="display:inline-block;padding:14px 28px;
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:#ffffff;text-decoration:none;
border-radius:8px;font-size:15px;font-weight:bold;">
                            立即续订域名
                        </a>
                    </td>
                </tr>

                <tr><td height="20"></td></tr>

                <tr>
                    <td align="center" style="font-size:13px;color:#9ca3af;">
                        如已完成续订，请点击确认：
                    </td>
                </tr>

                <tr><td height="15"></td></tr>

                <tr>
                    <td align="center">
                        <a href="https://jaxon.dpdns.org/renewCheck"
                           style="display:inline-block;padding:10px 20px;
background:#f3f4f6;color:#374151;
text-decoration:none;border-radius:6px;
font-size:14px;border:1px solid #e5e7eb;">
                            我已续订
                        </a>
                    </td>
                </tr>

                <tr><td height="30"></td></tr>
            </table>

        </td>
    </tr>
</table>
